# ============================================================================
# PRO-A311D —— Amlogic A311D 核心板 (W400 参考设计, amlogic-dt-id = "g12b_w400_b")
#
# 落点: userpatches/config/boards/pro-a311d.conf
#   依据 lib/functions/main/config-prepare.sh 的 config_source_board_file():
#     local -a board_file_paths=("${SRC}/config/boards" "${USERPATCHES_PATH}/config/boards")
#   → 上游 config/boards/ 与本目录都会被 source。放这里 = 不碰上游文件。
#
# 同 SoC 参考: Khadas VIM3 (khadas-vim3.conf), BOOTCONFIG 直接复用其 defconfig。
# ============================================================================

BOARD_NAME="PRO-A311D"
BOARDFAMILY="meson-g12b"
BOOTCONFIG="khadas-vim3_defconfig"     # 同 SoC (A311D) 复用; 要干净需从厂商 u-boot 派生 pro-a311d_defconfig
KERNEL_TARGET="current,edge"
FULL_DESKTOP="yes"
SERIALCON="ttyAML0"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="amlogic/meson-g12b-a311d-pro-a311d.dtb"

# ============================================================================
# FIP 树路径 —— 必须放在 cache/ 之外
#
# 原因: config/sources/families/include/meson64_common.inc 的
#   fetch_sources_tools__libreelec_amlogic_fip() 会
#   fetch_from_repo "https://github.com/LibreELEC/amlogic-boot-fip" 到
#   $SRC/cache/sources/amlogic-boot-fip，而 fetch_from_repo 会 git clean 掉
#   该目录下所有未跟踪内容。LibreELEC 仓库里没有 pro-a311d 目录
#   → 拷进 cache 的自定义 FIP 树每次构建都被删。
#
# 症状: uboot_g12_postprocess 报 ".../pro-a311d/blx_fix.sh: No such file or directory"
#       (Error 127)，且整个目录消失。
#
# 用 ${VAR:-default} 形式，让外部可用环境变量覆盖（本地开发指到自己的目录）:
#   export FIP_TREE_PRO_A311D=/path/to/amlogic-boot-fip/pro-a311d
# 默认值指向 ${SRC}/fip/pro-a311d —— 由 scripts/deploy-to-build.sh 从本仓库的
# fip/ 目录拷进去，CI 与本地走同一条路。
# ============================================================================
FIP_TREE_PRO_A311D="${FIP_TREE_PRO_A311D:-${SRC}/fip/pro-a311d}"

# ============================================================================
# 说明
#
# 1. u-boot 的 FIP 组装入口 uboot_custom_postprocess() 由
#      userpatches/config/sources/families/meson-g12b.conf
#    覆盖（该文件在 core 版本之后 source，函数重定义生效）。
#    上游 meson-g12b.conf 的 if/elif 链末尾是 `exit 2`，不插分支本板直接退出。
#
# 2. 内核 dts 不在这里，见 dts/meson-g12b-a311d-pro-a311d.dts，
#    由 scripts/deploy-to-build.sh 派生到
#      userpatches/kernel/archive/meson64-<MAJOR.MINOR>/dt/
#    （目录名随内核大版本变，脚本从 meson64_common.inc 的 case $BRANCH 派生，
#     不写死版本号 —— 写死就是「镜像编出来了但里面没有本板 dtb」那个坑）。
#
# 3. ASOUND_STATE 不设置 → 回退 family 默认 asound.state.meson64
#    （音频未适配，见 docs/porting-notes.md 的待核对项）。
# ============================================================================
