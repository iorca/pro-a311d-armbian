# ============================================================================
# PRO-A311D overlay —— 覆盖 core 的 uboot_custom_postprocess()
#
# 落点: userpatches/config/sources/families/meson-g12b.conf
#
# 为什么这里能生效（源码依据）:
#   lib/functions/configuration/main-config.sh 的 source_family_config_and_arch():
#
#     declare -a family_source_paths=("${SRC}/config/sources/families/${LINUXFAMILY}.conf"
#                                     "${USERPATCHES_PATH}/config/sources/families/${LINUXFAMILY}.conf")
#     for family_source_path in "${family_source_paths[@]}"; do
#         [[ ! -f "${family_source_path}" ]] && continue
#         source "${family_source_path}"          # ← 两个都会被 source，同一个 shell
#         family_sourced_ok=$((family_sourced_ok + 1))
#     done
#
#   core 的先 source，本文件的**后** source，同一个 shell 里函数重定义
#   → 后定义的生效。所以这里可以整体替换 uboot_custom_postprocess()，
#     而**不需要动上游哪怕一个字节**。
#
# 为什么不在上游 meson-g12b.conf 里插一个 elif 分支:
#   1) 上游那串 if/elif 末尾是 `else echo ...; exit 2`，新板不插分支就直接退出 2；
#   2) 但把整个 core 文件拷进 overlay 覆盖，会随上游重构**静默漂移** ——
#      26.x 已经把 khadas-vim3 / odroidn2* / cainiao-cniot-core 改走板级
#      post_uboot_custom_postprocess hook，family 里只留 `:`。覆盖 = 冻结在旧结构。
#   3) 上游自己写了 @TODO（meson-g12b.conf:17）:
#        "these should come from FIP_TREE_BOARD/FIP_TREE_FAMILY vars in board.conf"
#      —— 该变量上游还没实现，所以这里按它的意图自己实现。
# ============================================================================

# 只在构建本板时接管；别的 meson-g12b 板（vim3 / odroidn2 …）走 core 的原逻辑。
if [[ "${BOARD}" == "pro-a311d" ]]; then

	function uboot_custom_postprocess() {
		# FIP 树必须在 cache/ 之外 —— 见 board conf 里那段长注释。
		# 默认 ${SRC}/fip/pro-a311d，由 scripts/deploy-to-build.sh 从本仓库 fip/ 拷入；
		# 本地开发可 export FIP_TREE_PRO_A311D=/your/path/pro-a311d 覆盖。
		local fip_tree="${FIP_TREE_PRO_A311D:-${SRC}/fip/pro-a311d}"

		if [[ ! -d "${fip_tree}" ]]; then
			exit_with_error "PRO-A311D FIP tree not found: ${fip_tree}" \
				"Set FIP_TREE_PRO_A311D=/path/to/amlogic-boot-fip/pro-a311d, or run scripts/deploy-to-build.sh to install fip/ from this repo."
		fi
		if [[ ! -x "${fip_tree}/blx_fix.sh" ]]; then
			exit_with_error "PRO-A311D: ${fip_tree}/blx_fix.sh is not executable" \
				"git 必须记录它的 +x 位 (mode 100755)。检查: git ls-files -s fip/pro-a311d/blx_fix.sh"
		fi

		display_alert "PRO-A311D: assembling Amlogic FIP" "tree: ${fip_tree}" "info"
		# $2 = 家族 (g12b) → 决定用 aml_encrypt_g12b
		uboot_g12_postprocess "${fip_tree}" g12b
	}

fi
